# Config preset for the demtest2 / testodsy stack.
#
# Usage:
#   cp config.demtest2.yaml config.yaml
#   $EDITOR config.yaml    # set the docker container name to match your host
#   python run.py run
#
# What this monitors:
#   1. The HTTP health endpoint at https://testodsy.wrtual.in/getHealth/
#      — fires immediately if any subsystem != "working", or if the endpoint
#      times out / returns non-2xx / returns malformed JSON.
#   2. The Nginx access log at /var/log/nginx/demtest2/accessapi.log
#      — fires on 5xx spikes and high p95 latency.
#   3. Docker container logs for the API container
#      — fires on error bursts and critical patterns (panic, OOM, traceback…).

sources:
  http_health:
    - name: testodsy-health
      url: https://testodsy.wrtual.in/getHealth/
      interval_seconds: 30
      timeout_seconds: 10
      expected_value: working
      verify_ssl: true

  docker:
    - name: demtest2-api
      container: demtest2-api      # <-- change to the real container name
      kind: api                    # api | nginx | generic

  files:
    - name: nginx-access
      path: /var/log/nginx/demtest2/accessapi.log
      kind: nginx_access

detector:
  window_seconds: 60
  nginx_5xx_rate_threshold: 0.05
  api_error_count_threshold: 10
  nginx_p95_latency_seconds: 2.5
  critical_patterns:
    - "panic"
    - "out of memory"
    - "segmentation fault"
    - "ECONNREFUSED"
    - "deadlock detected"
    - "traceback"
    - "unhandled exception"

# Rule-based diagnoser. Used when LLM_PROVIDER=none, and as the safety net
# whenever the LLM is unavailable (quota, network, etc.).
#
# How it works: when a signal fires (health-check failure, error burst, ...),
# the engine searches the failing subsystem names + log excerpt for the
# keywords in each rule. The highest-scoring rule wins, and the agent
# suggests/runs `restart_container` for that rule's container.
policy:
  api_container: demtest2-api          # <-- the container running the API
  default_action: restart_api          # restart_api | notify_only

  dependencies:
    - label: RabbitMQ
      container: demtest2-rabbitmq     # <-- change to your real container name
      keywords:
        - "rabbitmq"
        - "amqp"
        - "RabbitMQHealthCheck"
        - "connection refused.*:5672"
        - "pika\\.exceptions"

    - label: Redis
      container: demtest2-redis        # <-- change to your real container name
      keywords:
        - "redis"
        - "Cache backend"
        - "ECONNREFUSED.*:6379"
        - "MISCONF"
        - "READONLY You can't write"

    - label: PostgreSQL
      container: demtest2-postgres     # <-- change to your real container name
      keywords:
        - "postgres"
        - "psycopg"
        - "DatabaseBackend"
        - "could not connect to server"
        - "FATAL:.*database"
        - "OperationalError"

    - label: Disk
      container: demtest2-api          # disk issues affect the API container itself
      keywords:
        - "DiskUsage"
        - "no space left on device"
        - "ENOSPC"

    - label: Memory
      container: demtest2-api
      keywords:
        - "MemoryUsage"
        - "out of memory"
        - "OOMKilled"
        - "MemoryError"
